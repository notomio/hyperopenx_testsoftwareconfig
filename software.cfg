[buildout]
#allow-picked-versions = true

extends =
  buildout.hash.cfg
  https://lab.nexedi.com/nexedi/slapos/raw/1.0.500/stack/monitor/buildout.cfg
  https://lab.nexedi.com/nexedi/slapos/raw/1.0.500/stack/slapos.cfg
  https://lab.nexedi.com/nexedi/slapos/raw/1.0.500/component/python3/buildout.cfg
  https://lab.nexedi.com/nexedi/slapos/raw/1.0.500/component/git/buildout.cfg
  https://lab.nexedi.com/nexedi/slapos/raw/1.0.500/component/python-cffi/buildout.cfg

parts = 
  interpreter
  slapos-cookbook
  osie-repository
  instance-profile

[python]
part = python3.14

[interpreter]
recipe = zc.recipe.egg:scripts
interpreter = py
eggs =
  asyncua
  ${python-cffi:egg}
  opencv-python
  pyopenssl

[osie-repository]
recipe  = slapos.recipe.build:gitclone
git-executable = ${git:location}/bin/git
repository = https://lab.nexedi.com/nexedi/osie.git
location = ${buildout:parts-directory}/osie
revision = 0.0.6.5.1

[versions]
cryptography = 42.0.8:whl
PyYAML = 6.0.1
aiosqlite = 0.20.0:whl
aiofiles = 24.1.0:whl
pyOpenSSL = 24.1.0
opencv-python = 4.14.0.94:whl
asyncua = 2.0.1:whl
numpy = 2.4.6:whl

[instance-profile]
recipe = slapos.recipe.template:jinja2
template = ${:_profile_base_location_}/instance.cfg.in
rendered = ${buildout:directory}/instance.cfg
context =
  section buildout buildout
  key interpreter_location buildout:bin-directory
  key osie_repository_location osie-repository:location
